name: Compatibility report
description: Report how a skill worked in a specific agent, so docs/PLATFORM_COMPATIBILITY.md can be updated.
labels: ["compatibility"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Worked end to end
        - Worked after an adaptation (describe it below)
        - Partly worked
        - Did not work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you asked, what the agent did, and any adaptation you needed
    validations:
      required: true
