name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    name: Skills, catalog and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skills, manifests, documentation links and privacy rules
        run: python scripts/validate_skills.py

      - name: Check that the catalog is current
        run: python scripts/generate_catalog.py --check

      - name: Run tests
        run: python -m pytest tests -v -rs  # -rs lists skipped tests and why

  installer:
    name: Vercel Skills CLI discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Every public skill folder is discoverable, and nothing else
        run: |
          expected=$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          npx -y skills@1.7.6 add . --list 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee list.txt  # strip colour codes
          grep -q "Found ${expected} skills" list.txt || { echo "::error::Skills CLI did not find ${expected} skills"; exit 1; }
